# IA-ZEST — API PHP + Postgres + Redis
# Subir:   docker compose up -d --build
# Escalar: docker compose up -d --scale api=4
name: ia-zest

x-env-api: &env-api
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: ${DB_NAME:-ia_zest}
  DB_USER: ${DB_USER:-ia_zest}
  DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
  REDIS_HOST: redis
  JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (32+ caracteres)}
  JWT_TTL: ${JWT_TTL:-3600}
  BCRYPT_COST: ${BCRYPT_COST:-12}
  CORS_ORIGENS: ${CORS_ORIGENS:-*}
  CONFIAR_PROXY: "1"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ia_zest}
      POSTGRES_USER: ${DB_USER:-ia_zest}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    volumes: [db-dados:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # roda uma vez: migrações + seeds (idempotentes) antes da API aceitar tráfego
  migrar:
    build: ./back
    image: ia-zest-api:latest
    environment:
      <<: *env-api
      SEED_EMAIL: ${SEED_EMAIL:-demo@iazest.dev}
      SEED_SENHA: ${SEED_SENHA:-Demo@2026}
    command: ["sh", "-c", "vendor/bin/phinx migrate -c phinx.php && vendor/bin/phinx seed:run -c phinx.php"]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    image: ia-zest-api:latest
    restart: unless-stopped
    environment: *env-api
    depends_on:
      migrar: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["${API_PORTA:-8091}:80"]
    volumes: ["./back/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  db-dados:
